<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — FinPlan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0f1e; --surface: #111827; --border: #1e2d45;
      --accent: #00d4aa; --accent2: #3b82f6;
      --text: #e2e8f0; --muted: #64748b; --danger: #ef4444;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Sora', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }
    .logo { font-size: 1.5rem; font-weight: 700; color: var(--accent); text-align: center; margin-bottom: .3rem; }
    .tagline { font-size: .85rem; color: var(--muted); text-align: center; margin-bottom: 2rem; }
    label { display: block; font-size: .8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: .4rem; }
    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Sora', sans-serif;
      font-size: .95rem;
      padding: .75rem 1rem;
      outline: none;
      margin-bottom: 1.2rem;
      transition: border-color .2s;
    }
    input:focus { border-color: var(--accent); }
    input.error { border-color: var(--danger); }
    .error-msg { font-size: .8rem; color: var(--danger); margin-top: -.9rem; margin-bottom: 1rem; display: none; }
    .btn {
      width: 100%;
      padding: .85rem;
      border-radius: 10px;
      border: none;
      font-family: 'Sora', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #0a0f1e;
      transition: opacity .2s;
      margin-bottom: 1rem;
    }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .link-row { text-align: center; font-size: .88rem; color: var(--muted); }
    .link-row a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .link-row a:hover { text-decoration: underline; }
    .global-err {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 8px;
      padding: .7rem 1rem;
      font-size: .85rem;
      color: var(--danger);
      margin-bottom: 1.2rem;
      display: none;
    }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(0,0,0,.3);
      border-top-color: #0a0f1e;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: .4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">FinPlan</div>
  <p class="tagline">Seu dinheiro, seu controle.</p>

  <div class="global-err" id="global-err"></div>

  <label for="email">E-mail</label>
  <input type="email" id="email" placeholder="voce@email.com" autocomplete="email" />
  <p class="error-msg" id="err-email">Informe um e-mail válido.</p>

  <label for="senha">Senha</label>
  <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" />
  <p class="error-msg" id="err-senha">Informe sua senha.</p>

  <button class="btn" id="btn-login" onclick="fazerLogin()">Entrar</button>

  <div class="link-row">
    Não tem conta? <a href="/cadastro.html">Cadastre-se</a>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);

  function showErr(id, show, msg) {
    const el = $(id);
    if (!el) return;
    el.style.display = show ? 'block' : 'none';
    if (msg) el.textContent = msg;
  }

  async function fazerLogin() {
    const email = $('email').value.trim();
    const senha = $('senha').value;
    const btn   = $('btn-login');

    // Limpa erros anteriores
    showErr('err-email', false);
    showErr('err-senha', false);
    $('global-err').style.display = 'none';
    $('email').classList.remove('error');
    $('senha').classList.remove('error');

    // Validação local
    let ok = true;
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showErr('err-email', true); $('email').classList.add('error'); ok = false;
    }
    if (!senha) {
      showErr('err-senha', true); $('senha').classList.add('error'); ok = false;
    }
    if (!ok) return;

    // Chamada ao servidor
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Entrando...';

    try {
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, senha }),
      });

      const data = await res.json();

      if (res.ok) {
        // Salva dados do usuário no localStorage
        localStorage.setItem('finplan_user', JSON.stringify({
          id:      data.userId,
          email:   data.email,
          hasData: data.hasData,
        }));

        // Redirecionamento inteligente:
        // → Primeira vez (sem dados): vai para o formulário
        // → Já tem dados: vai direto pro dashboard
        window.location.href = data.hasData ? '/dashboard.html' : '/formulario.html';
      } else {
        const errEl = $('global-err');
        errEl.textContent = data.mensagem || 'Erro ao fazer login.';
        errEl.style.display = 'block';
      }
    } catch {
      const errEl = $('global-err');
      errEl.textContent = 'Erro de conexão. Tente novamente.';
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Entrar';
    }
  }

  // Enter confirma login
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') fazerLogin();
  });
</script>
</body>
</html>
